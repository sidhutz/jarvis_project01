<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050812">
    <title>Jarvis // Feature Console</title>
    <link rel="shortcut icon" href="assets/img/sidhu.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="features.css">
</head>
<body>
    <div class="cyber-grid" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <main class="console-shell">
        <header class="console-header">
            <a class="back-link" href="index.html"><i class="bi bi-arrow-left"></i> Assistant</a>
            <div class="brand"><span class="brand-mark">J</span><span>JARVIS <em>//</em> FEATURE CONSOLE</span></div>
            <div class="system-status"><span class="status-dot"></span> SYSTEM ONLINE</div>
        </header>

        <section class="hero">
            <div>
                <p class="eyebrow">AI CAPABILITY MAP <span>01—09</span></p>
                <h1>Everything Jarvis can <span>do for you.</span></h1>
                <p class="hero-copy">Select any module to see what it does and copy a voice or text command you can use immediately.</p>
            </div>
            <div class="radar" aria-label="Jarvis capability scanner"><div class="radar-core">AI</div></div>
        </section>

        <section class="feature-layout" aria-label="Jarvis features">
            <div id="featureGrid" class="feature-grid"></div>
            <aside id="featureDetail" class="feature-detail" aria-live="polite"></aside>
        </section>

        <footer><span>JARVIS AI // WINDOWS ASSISTANT</span><span>TIP: CLICK A COMMAND TO COPY</span></footer>
    </main>
    <script src="features.js"></script>
</body>
</html>
